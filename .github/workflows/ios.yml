name: Native iOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - run: brew install xcodegen
      - run: cargo test --manifest-path Engine/Cargo.toml --locked --release
      - run: bash scripts/build-engine.sh
      - run: xcodegen generate
      - name: Run Swift tests
        run: |
          xcrun simctl list devices available --json > /tmp/x3fuse-simulators.json
          test_device_id=$(python3 -c 'import json; data=json.load(open("/tmp/x3fuse-simulators.json")); print(next(d["udid"] for runtime, devices in data["devices"].items() if "iOS" in runtime for d in devices if d["isAvailable"] and d["name"].startswith("iPhone")))')
          xcodebuild -project X3FuseNative.xcodeproj -scheme X3FuseNative -configuration Release -destination "platform=iOS Simulator,id=$test_device_id" CODE_SIGNING_ALLOWED=NO test
